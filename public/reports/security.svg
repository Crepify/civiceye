<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Suspicious activity on campus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c0519"/>
      <stop offset="0.55" stop-color="#9f1239"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fda4af" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="#fecdd3" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/><line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/>
  </g>
  <!-- Shield -->
  <g transform="translate(400 225)">
    <path d="M0 -120 L85 -75 V15 C85 110 0 165 0 165 C0 165 -85 110 -85 15 V-75 Z" fill="#fff1f2" fill-opacity="0.95" stroke="#fecdd3" stroke-width="4"/>
    <circle cx="0" cy="-20" r="34" fill="none" stroke="#9f1239" stroke-width="8"/>
    <circle cx="0" cy="-20" r="10" fill="#9f1239"/>
    <path d="M0 18 L0 60" stroke="#9f1239" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Eye -->
  <g transform="translate(400 225)">
    <ellipse cx="0" cy="95" rx="46" ry="26" fill="none" stroke="#fecdd3" stroke-width="5"/>
    <circle cx="0" cy="95" r="8" fill="#fecdd3"/>
  </g>
  <circle cx="130" cy="110" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="680" cy="400" r="2.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="640" cy="90" r="2" fill="#ffffff" opacity="0.35"/>
</svg>
