<!-- 
  recaptcha-gate.html
  Drop this in /public/components/ (or /static/components/)
  Usage: <script src="/components/recaptcha-gate.html" type="module"></script>
         <recaptcha-gate sitekey="YOUR_KEY" action="login"></recaptcha-gate>
-->
<template id="recaptcha-gate-template">
  <style>
    :host {
      --rc-primary: #1a73e8;
      --rc-primary-hover: #1557b0;
      --rc-bg: #ffffff;
      --rc-border: #e0e0e0;
      --rc-text: #202124;
      --rc-text-muted: #5f6368;
      --rc-error: #d93025;
      --rc-success: #188038;
      --rc-radius: 12px;
      --rc-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --rc-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
      --rc-transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);

      display: block;
      font-family: var(--rc-font);
      contain: content; /* Performance isolation */
    }

    /* --- Layout --- */
    .gate-container {
      background: var(--rc-bg);
      border: 1px solid var(--rc-border);
      border-radius: var(--rc-radius);
      box-shadow: var(--rc-shadow);
      padding: 1.5rem;
      max-width: 360px;
      margin: 0 auto;
      transition: border-color var(--rc-transition), box-shadow var(--rc-transition);
    }
    :host([state="verifying"]) .gate-container { border-color: var(--rc-primary); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.2); }
    :host([state="success"]) .gate-container { border-color: var(--rc-success); }
    :host([state="error"]) .gate-container { border-color: var(--rc-error); }

    /* --- Typography --- */
    .gate-title { font-size: 1.125rem; font-weight: 600; color: var(--rc-text); margin: 0 0 0.25rem; text-align: center; }
    .gate-subtitle { font-size: 0.875rem; color: var(--rc-text-muted); margin: 0 0 1.5rem; text-align: center; }

    /* --- Widget Wrapper (Centers the iframe) --- */
    .widget-wrapper { display: flex; justify-content: center; min-height: 78px; /* approx recaptcha v2 height */ }
    .widget-wrapper > div { width: 100%; max-width: 304px; } /* Standard reCAPTCHA width */

    /* --- Status Bar (Bottom) --- */
    .status-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--rc-border);
      font-size: 0.75rem; color: var(--rc-text-muted);
      min-height: 20px;
    }
    .status-text { display: flex; align-items: center; gap: 0.5rem; }
    .status-text svg { width: 16px; height: 16px; flex-shrink: 0; }
    .status-text.success { color: var(--rc-success); }
    .status-text.error { color: var(--rc-error); }
    .status-text.verifying { color: var(--rc-primary); }

    /* --- Spinner --- */
    .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Skeleton Loader (While JS loads) --- */
    .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
    @keyframes shimmer { to { background-position-x: -200%; } }
    .skeleton-title { height: 20px; width: 60%; margin: 0 auto 0.5rem; }
    .skeleton-text { height: 14px; width: 80%; margin: 0 auto 1.5rem; }
    .skeleton-widget { height: 78px; width: 100%; max-width: 304px; margin: 0 auto; border-radius: 8px; }
    .skeleton-footer { height: 12px; width: 40%; margin: 1rem auto 0; }

    /* --- Reduced Motion --- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* --- Hidden Utility --- */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>

  <div class="gate-container" role="region" aria-label="Security Verification" aria-live="polite">
    <!-- Initial Skeleton State (Rendered instantly before JS hydrates) -->
    <div class="skeleton-load" part="skeleton">
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton skeleton-text"></div>
      <div class="skeleton skeleton-widget"></div>
      <div class="skeleton skeleton-footer"></div>
    </div>

    <!-- Live Content (Hydrated by JS) -->
    <div class="live-content" hidden>
      <h3 class="gate-title">Security Check</h3>
      <p class="gate-subtitle">Please verify you are human to continue.</p>
      
      <div class="widget-wrapper" id="widgetMount" aria-label="reCAPTCHA Widget"></div>
      
      <div class="status-bar" aria-live="polite" aria-atomic="true">
        <div class="status-text" id="statusText">
          <span data-initial>Protected by reCAPTCHA</span>
        </div>
        <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer" style="font-size: 0.75rem; color: var(--rc-text-muted); text-decoration: none;">Privacy</a>
      </div>
    </div>
  </div>

  <!-- Live Region for Screen Readers (Announces success/fail) -->
  <div class="sr-only" aria-live="assertive" aria-atomic="true" id="srAnnouncer"></div>
</template>

<script type="module">
  (() => {
    const template = document.getElementById('recaptcha-gate-template');
    if (!template) return; // Safety check if imported multiple times weirdly

    class RecaptchaGate extends HTMLElement {
      static get observedAttributes() { return ['sitekey', 'action', 'theme', 'disabled']; }

      constructor() {
        super();
        this.attachShadow({ mode: 'open', delegatesFocus: true });
        this.shadowRoot.appendChild(template.content.cloneNode(true));
        
        // Refs
        this.$container = this.shadowRoot.querySelector('.gate-container');
        this.$skeleton = this.shadowRoot.querySelector('.skeleton-load');
        this.$live = this.shadowRoot.querySelector('.live-content');
        this.$mount = this.shadowRoot.querySelector('#widgetMount');
        this.$status = this.shadowRoot.querySelector('#statusText');
        this.$sr = this.shadowRoot.querySelector('#srAnnouncer');
        
        // State
        this.widgetId = null;
        this.recaptchaLoaded = false;
        this._resolveReady = null;
        this.readyPromise = new Promise(r => this._resolveReady = r);
      }

      // --- Lifecycle ---
      connectedCallback() {
        this._applyAttributes();
        this._loadRecaptchaScript().then(() => this._renderWidget());
      }

      attributeChangedCallback(name, oldVal, newVal) {
        if (oldVal === newVal) return;
        if (name === 'sitekey' || name === 'action') this._renderWidget();
        if (name === 'theme') this._applyTheme(newVal);
        if (name === 'disabled') this._toggleDisabled(this.hasAttribute('disabled'));
      }

      // --- Public API ---
      /** Returns Promise<string> - resolves with token on success, rejects on error/expire */
      async getToken() {
        await this.readyPromise;
        if (this.widgetId === null) throw new Error('Widget not rendered');
        return new Promise((resolve, reject) => {
          // Execute v3 or get response v2
          if (this._isV3()) {
            grecaptcha.execute(this.getAttribute('sitekey'), { action: this.getAttribute('action') || 'verify' })
              .then(resolve).catch(reject);
          } else {
            const token = grecaptcha.getResponse(this.widgetId);
            if (token) resolve(token);
            else {
              // Wait for user interaction
              const cb = (token) => { cleanup(); resolve(token); };
              const exp = () => { cleanup(); reject(new Error('Expired')); };
              const err = () => { cleanup(); reject(new Error('Error')); };
              this._oneTimeCallbacks = { cb, exp, err };
              // We rely on the global callbacks set in _renderWidget to trigger these
            }
          }
        });
      }

      reset() { if (this.widgetId !== null) grecaptcha.reset(this.widgetId); this._setState('idle'); }
      execute() { return this.getToken(); }

      // --- Internals ---
      _applyAttributes() {
        this._applyTheme(this.getAttribute('theme'));
        this._toggleDisabled(this.hasAttribute('disabled'));
      }

      _applyTheme(theme) {
        if (theme === 'dark') {
          this.shadowRoot.host.style.setProperty('--rc-bg', '#202124');
          this.shadowRoot.host.style.setProperty('--rc-border', '#3c4043');
          this.shadowRoot.host.style.setProperty('--rc-text', '#e8eaed');
          this.shadowRoot.host.style.setProperty('--rc-text-muted', '#9aa0a6');
        } else {
          // Reset to defaults (defined in :host)
          this.shadowRoot.host.style.removeProperty('--rc-bg');
          this.shadowRoot.host.style.removeProperty('--rc-border');
          this.shadowRoot.host.style.removeProperty('--rc-text');
          this.shadowRoot.host.style.removeProperty('--rc-text-muted');
        }
      }

      _toggleDisabled(disabled) {
        this.$container.style.opacity = disabled ? '0.6' : '1';
        this.$container.style.pointerEvents = disabled ? 'none' : 'auto';
        this.$container.setAttribute('aria-disabled', disabled);
      }

      _isV3() { return this.hasAttribute('action'); } // Simple heuristic: if action passed, treat as v3 flow potential

      async _loadRecaptchaScript() {
        if (window.grecaptcha?.render) { this.recaptchaLoaded = true; this._resolveReady(); return; }
        if (window.__recaptchaGateLoadPromise) return window.__recaptchaGateLoadPromise;

        window.__recaptchaGateLoadPromise = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          const key = this.getAttribute('sitekey');
          const renderParam = this._isV3() ? '' : '?render=explicit'; // v2 needs explicit render
          script.src = `https://www.google.com/recaptcha/api.js${renderParam}&onload=__recaptchaGateOnload`;
          script.async = true;
          script.defer = true;
          script.onerror = () => reject(new Error('Failed to load reCAPTCHA script'));
          document.head.appendChild(script);

          // Global callback hook
          window.__recaptchaGateOnload = () => {
            this.recaptchaLoaded = true;
            this._resolveReady();
            resolve();
            // Cleanup global
            delete window.__recaptchaGateOnload;
            delete window.__recaptchaGateLoadPromise;
          };
        });
        return window.__recaptchaGateLoadPromise;
      }

      _renderWidget() {
        if (!this.recaptchaLoaded) return;
        if (!this.getAttribute('sitekey')) { this._setState('error', 'Sitekey missing'); return; }

        this.$skeleton.hidden = true;
        this.$live.hidden = false;

        const sitekey = this.getAttribute('sitekey');
        const theme = this.getAttribute('theme') || 'light';
        
        // Clear previous
        this.$mount.innerHTML = ''; 
        if (this.widgetId !== null) { try { grecaptcha.reset(this.widgetId); } catch(e) {} }

        // Determine V2 vs V3 (Invisible)
        // If 'action' is present, we *can* do v3 execute, but usually v2 Checkbox is safer for "Gate" UI.
        // We default to V2 Checkbox for visible UI. 
        // If you want V3 Invisible, just don't render widget and call execute() manually.
        
        this.widgetId = grecaptcha.render(this.$mount, {
          sitekey,
          theme,
          size: 'normal', // 'compact' or 'invisible'
          callback: (token) => this._onSuccess(token),
          'expired-callback': () => this._onExpire(),
          'error-callback': () => this._onError()
        });

        this._setState('idle');
      }

      // --- Callbacks ---
      _onSuccess(token) {
        this._setState('success');
        this.$sr.textContent = 'Verification successful';
        this.dispatchEvent(new CustomEvent('verified', { 
          detail: { token, action: this.getAttribute('action') }, 
          bubbles: true, composed: true // Escapes Shadow DOM!
        }));
        
        // Auto-reset after success for SPAs? Optional. 
        // setTimeout(() => this.reset(), 3000); 
      }

      _onExpire() {
        this._setState('error', 'Verification expired. Please try again.');
        this.$sr.textContent = 'Verification expired';
        this.dispatchEvent(new CustomEvent('expired', { bubbles: true, composed: true }));
      }

      _onError() {
        this._setState('error', 'Network error. Please retry.');
        this.$sr.textContent = 'Verification failed';
        this.dispatchEvent(new CustomEvent('error', { bubbles: true, composed: true }));
      }

      // --- UI State Machine ---
      _setState(state, customMsg) {
        this.setAttribute('state', state);
        const initialText = this.$status.querySelector('[data-initial]');
        
        this.$status.innerHTML = ''; // Clear
        const span = document.createElement('span');

        switch(state) {
          case 'verifying':
            span.className = 'status-text verifying';
            span.innerHTML = `<svg class="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="30 100" stroke-linecap="round"/></svg> Verifying...`;
            break;
          case 'success':
            span.className = 'status-text success';
            span.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg> Verified`;
            break;
          case 'error':
            span.className = 'status-text error';
            span.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> ${customMsg || 'Verification failed'}`;
            break;
          default: // idle
            if (initialText) this.$status.appendChild(initialText);
            else this.$status.textContent = 'Protected by reCAPTCHA';
            return;
        }
        this.$status.appendChild(span);
      }
    }

    // Define only once
    if (!customElements.get('recaptcha-gate')) {
      customElements.define('recaptcha-gate', RecaptchaGate);
    }
  })();
</script>
