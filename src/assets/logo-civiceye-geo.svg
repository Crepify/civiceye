<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CivicEye — geometric eye-pin mark">
  <!-- Bold chevron/pin -->
  <path
    d="M14 8 L50 8 L32 54 Z"
    fill="none"
    stroke="#4F46E5"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- Circle overlapping the chevron -->
  <circle cx="32" cy="26" r="13" fill="none" stroke="#10B981" stroke-width="4"/>
  <!-- Negative-space eye: almond cut inside the circle -->
  <path
    d="M22 24 Q32 16 42 24 Q32 36 22 24 Z"
    fill="#10B981"
  />
  <!-- Pupil -->
  <circle cx="32" cy="24" r="3.5" fill="#FAFAFA"/>
  <!-- Amber accent dot (pin tip) -->
  <circle cx="32" cy="56" r="2.8" fill="#F59E0B"/>
</svg>
