<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CivicEye logo — C and eye mark">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Bold C (open circle) with pointed pin bottom, read as eye + pin -->
  <g fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main C stroke -->
    <path
      d="M42 8
         C 26 8, 14 18.5, 14 32
         C 14 45.5, 26 56, 42 56
         L 42 44
         C 32 44, 25 38.5, 25 32
         C 25 25.5, 32 20, 42 20 Z"
      stroke-width="6.5"
    />
  </g>

  <!-- Pin point at bottom of the C -->
  <path
    d="M42 44 L46 56 L38 56 Z"
    fill="#10B981"
    stroke="none"
  />

  <!-- Eye pupil inside the C -->
  <circle cx="40" cy="32" r="5.5" fill="#10B981"/>
  <circle cx="40" cy="32" r="2" fill="#0B1120"/>

  <!-- Accent dot -->
  <circle cx="52" cy="10" r="3.5" fill="#34D399"/>
</svg>
