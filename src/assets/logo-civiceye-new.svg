<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CivicEye logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B1120"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glow)"/>

  <!-- Map pin (eye-in-pin) -->
  <g transform="translate(32 33)">
    <path
      d="M0 -20 C-8.5 -20 -15 -13.5 -15 -5 C-15 5.5 -4.5 13 -0.5 17.2 C0.3 18 1.7 18 2.5 17.2 C6.5 13 15 5.5 15 -5 C15 -13.5 8.5 -20 0 -20 Z"
      fill="#ffffff"
    />
    <!-- Eye -->
    <ellipse cx="0" cy="-5" rx="6.2" ry="5.4" fill="none" stroke="#10B981" stroke-width="2.4"/>
    <circle cx="0" cy="-5" r="2.4" fill="#10B981"/>
  </g>

  <!-- Emerald accent dot -->
  <circle cx="50" cy="14" r="6" fill="#34D399" stroke="#0B1120" stroke-width="2"/>
</svg>
